[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autorush-aitester"
version = "0.1.0"
description = "Extensible test execution framework for AutoRush-AITester"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
  "websockets>=14,<17",
  "cryptography>=44,<49",
  "anyio>=4,<5",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]
web = ["playwright>=1.50,<2", "Pillow>=10,<13"]
desktop = ["pyautogui>=0.9.54,<1", "Pillow>=10,<13"]
mcp = ["mcp>=1.26,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
